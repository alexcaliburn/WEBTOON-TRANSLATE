
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webtoon Translator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #100d19;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      background: #1c1630;
      border-bottom: 2px solid #a855f7;
    }

    h1 {
      color: #c084fc;
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #c4b5d8;
    }

    main {
      max-width: 600px;
      margin: 35px auto;
      padding: 20px;
    }

    .panel {
      background: #1c1630;
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #49346b;
    }

    input {
      width: 100%;
      margin: 20px 0;
      color: white;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #9333ea;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #preview {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    #message {
      color: #c084fc;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>WEBTOON TRANSLATOR</h1>
    <p>Lis tes webtoons dans ta langue</p>
  </header>

  <main>
    <div class="panel">
      <h2>Traduire un webtoon</h2>
      <p>Importe une image de ton webtoon pour commencer.</p>

      <input type="file" id="imageInput" accept="image/*">

      <img id="preview" alt="Aperçu du webtoon">

      <button onclick="translateImage()">
        Traduire le chapitre
      </button>

      <p id="message"></p>
    </div>
  </main>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    imageInput.addEventListener("change", function() {
      const file = this.files[0];

      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        message.textContent = "Image importée avec succès !";
      }
    });

    function translateImage() {
      if (!imageInput.files.length) {
        message.textContent = "Importe d'abord une image.";
        return;
      }

      message.textContent =
        "La fonction de traduction sera ajoutée dans une prochaine étape.";
    }
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  </script>

</body>
</html>
